<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="stylesheet" href="login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./assets/img/favicon.ico"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="login-container">
      <div class="left-panel">
        <img src="./assets/img/homecamera.png" alt="Camera" class="bg-img" />

        <div class="overlay-text">
          <span class="dot"></span>
          <h1>Capture your moment with us.</h1>
          <p>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Morbi
            lobortis maximus nunc, ac rhoncus odio congue quis. Sed ac semper
            orci, eu porttitor lacus.
          </p>
        </div>
      </div>

      <div class="right-panel">
        <div class="form-wrapper">
          <h2>Sign Up</h2>

          <form class="login-form">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />

            <label for="password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Create your password"
                required
              />
            </div>

            <div class="forgot-password">
              <a href="#">Forget your password</a>
            </div>
            <div>
              <a href="book.html">
                <button type="submit" class="submit-btn">Sign up</button>
              </a>
            </div>
          </form>

          <div class="divider"><span>OR</span></div>

          <button class="social-btn google">
            <i class="ri-google-fill"></i>
            Continue with Google
          </button>

          <p class="bottom-signup">
            Don't have an account? <a href="login.html">Log in</a>
          </p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
